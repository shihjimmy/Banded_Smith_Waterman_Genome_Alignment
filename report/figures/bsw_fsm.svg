<text x="85" y="250" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="end" font-weight="normal" fill="#2b2b2b">(finish = 1)</text>
<text x="360" y="92" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#7a7a7a">t = 0 .. 2L-2</text>
<text x="250" y="433.225" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">LOAD: store S, T (valid may have gaps)</text>
<text x="250" y="446.975" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">INIT: load S/T shift registers</text>
<text x="250" y="460.725" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">RUN: one anti-diagonal step per cycle</text>
<text x="250" y="474.475" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">TB: traceback, DONE: finish pulse</text>
<line x1="530" y1="50" x2="530" y2="530" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="840" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#8e4a87">traceback FSM  (one op per cycle, starts at the best cell)</text>
